name: Release Android (Play)

# Publishes to Google Play. Only runs when a version tag is pushed (e.g.
# `git tag v1.0.1 && git push origin v1.0.1`) — ordinary commits to
# KEK/master only build; they never publish. The tag's own name (minus any
# -beta suffix) becomes the app's version name.
#
# Which track depends on the tag itself, so a build can be tried on real
# testers without deciding anything by hand:
#   git tag v1.0.1-beta   → Play's alpha (closed testing) track
#   git tag v1.0.1        → production, straight to real users
#
# There used to be no choice here — every tag went to alpha, back when
# production was locked behind Google's closed-testing requirement for new
# developer accounts. That requirement is now satisfied and production is
# unlocked, so plain tags go straight there; the -beta suffix is what is
# left of the old path, for when a build is worth a dry run first.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # .NET 9 SDK builds net8.0 TFMs too (Core/Infra/UI/tests) — it's the
          # one required here because Android API 36 (mandatory on Play from
          # Aug 30 2026) only ships in the net9.0-android workload, not net8.0-android.
          dotnet-version: "9.0.x"

      - name: Cache NuGet + workload packs
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.dotnet/sdk-manifests
            ~/.dotnet/packs
          key: ${{ runner.os }}-dotnet-android-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-android-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android API 36 platform
        run: >
          dotnet build -t:InstallAndroidDependencies -f net9.0-android36.0
          -p:AcceptAndroidSDKLicenses=true
          src/PasswordManager.App/PasswordManager.App.csproj

      - name: Run tests
        run: dotnet test tests/PasswordManager.Tests/PasswordManager.Tests.csproj -c Release --nologo

      # versionName comes from the tag; versionCode is the workflow run number plus
      # an offset. The offset exists because the first uploads to Play were made by
      # hand and burned the low codes (1, 2, 3) before this workflow ever ran — the
      # run number restarts from 1, so without it Play rejects the upload with
      # "Version code N has already been used". Raise CODE_OFFSET (never lower it)
      # if a manual upload ever overtakes the CI again.
      #
      # The track comes from the tag too: a trailing -beta sends the build to
      # alpha instead of production, and is stripped back out of versionName —
      # Play's testers should see "1.0.1", not "1.0.1-beta", since the tag
      # suffix is a routing instruction to this workflow, not part of the
      # version the person installing the app is meant to read.
      - name: Compute version and track from tag
        id: version
        run: |
          CODE_OFFSET=100
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" == *-beta ]]; then
            echo "name=${TAG%-beta}" >> "$GITHUB_OUTPUT"
            echo "track=alpha" >> "$GITHUB_OUTPUT"
          else
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
            echo "track=production" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$((CODE_OFFSET + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Publish signed .aab
        run: >
          dotnet publish src/PasswordManager.App/PasswordManager.App.csproj
          -f net9.0-android36.0 -c Release
          -p:AndroidPackageFormat=aab
          -p:AndroidKeyStore=true
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.name }}
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          -o "$RUNNER_TEMP/publish"

      - name: Remove keystore from disk
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.safetyvault.app
          releaseFiles: ${{ runner.temp }}/publish/*-Signed.aab
          # Plural form the action wants now; `track` (singular) still works but is slated
          # for removal and was already warning on every run.
          tracks: ${{ steps.version.outputs.track }}
          status: completed
