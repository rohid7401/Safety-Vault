<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- interactive-widget=resizes-content makes the soft keyboard shrink the layout
         viewport itself on Chromium 108+, which fixes `vh` and `position: fixed` at
         the source. The visualViewport script below covers older WebViews. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SafetyVault</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/PasswordManager.UI/css/app.css" />
    <link rel="stylesheet" href="_content/PasswordManager.UI/css/app-extras.css" />
    <link rel="stylesheet" href="PasswordManager.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

    <script>
        // ── Publish the visible viewport height as --app-vh ──
        // Android's WebView keeps reporting the full screen height for `vh` even
        // while the soft keyboard covers the bottom of it, so a layout sized with
        // `100vh` leaves its lower third behind the keyboard. visualViewport is the
        // only API that reports the box the user can actually see; app.css sizes the
        // shell, the unlock screen and the sheet backdrops from this variable.
        (function () {
            var vv = window.visualViewport;
            if (!vv) return;
            var root = document.documentElement;

            function sync() {
                root.style.setProperty('--app-vh', vv.height + 'px');
            }

            vv.addEventListener('resize', sync);
            vv.addEventListener('scroll', sync);
            sync();
        })();

        // ── Keep the focused field visible above the soft keyboard ──
        // The resize above frees up the space; this scrolls the field into it.
        document.addEventListener('focusin', function (e) {
            var el = e.target;
            if (!el || !el.matches || !el.matches('input, textarea, select')) return;
            if (el.type === 'checkbox' || el.type === 'range') return;

            // Wait for the keyboard animation to finish and the viewport to settle,
            // otherwise we scroll against the pre-resize geometry and undershoot.
            setTimeout(function () {
                el.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }, 300);
        });

        // ── Remember where each page was scrolled to ──
        // Blazor swaps the contents of `.page` on navigation but keeps the element, and the
        // browser clamps scrollTop to 0 the moment the new (briefly empty) content is shorter
        // than the old scroll offset. So leaving a page always lost your place, and coming back
        // to a long list dumped you at the top. MainLayout drives this: it saves before letting
        // a navigation proceed, and restores once the new route has rendered.
        (function () {
            var positions = {};
            var currentKey = null;
            // While a navigation is in flight the clamp-to-zero scroll event described above
            // fires; recording it would overwrite the position we just saved.
            var suspended = false;

            function page() { return document.querySelector('.page'); }

            // 'scroll' does not bubble, so listen in the capture phase to catch it on `.page`.
            document.addEventListener('scroll', function (e) {
                if (suspended || currentKey === null) return;
                var el = e.target;
                if (!el || !el.classList || !el.classList.contains('page')) return;
                positions[currentKey] = el.scrollTop;
            }, true);

            function restore(target) {
                // The new route may still be loading its data, so the content can be too short
                // to hold the offset for a few frames. Keep trying briefly, then give up rather
                // than fight a page that is genuinely shorter now.
                var attempts = 0;
                (function tick() {
                    var el = page();
                    if (el && el.scrollHeight - el.clientHeight >= target) {
                        el.scrollTop = target;
                        return;
                    }
                    if (++attempts < 30) requestAnimationFrame(tick);
                })();
            }

            window.safetyVaultScroll = {
                save: function (key) {
                    var el = page();
                    if (el && key !== null) positions[key] = el.scrollTop;
                    suspended = true;
                },
                restored: function (key) {
                    currentKey = key;
                    suspended = false;
                    var target = positions[key] || 0;
                    var el = page();
                    if (el) el.scrollTop = 0;   // never inherit the previous page's offset
                    if (target > 0) restore(target);
                }
            };
        })();

        // ── Geometry for the guided tour's spotlight ──
        // Blazor owns the sequence and the copy; this only answers "where is it, and where does
        // the bubble go". Nothing here moves or clones the highlighted element: the cutout is
        // painted over whatever is already on screen, where it already is.
        (function () {
            var SHELL = '.app-shell', PAGE = 'main.page', BUBBLE = '.tour-bubble';
            var GAP = 12,            // between cutout and bubble
                SIDE = 16,           // bubble inset from both edges
                BAR = 66,            // the progress bar at rest
                BAR_TOP = 92,        // taller when it sits on the app bar's side of the screen
                CLEAR = 74;          // bar + breathing room, for deciding which end it goes to

            function shell() { return document.querySelector(SHELL); }
            function page() { return document.querySelector(PAGE); }

            function union(names) {
                var out = null;
                for (var i = 0; i < names.length; i++) {
                    var el = document.querySelector('[data-tour="' + names[i] + '"]');
                    if (!el) continue;
                    var r = el.getBoundingClientRect();
                    if (!r.width && !r.height) continue;
                    out = out ? {
                        left: Math.min(out.left, r.left), top: Math.min(out.top, r.top),
                        right: Math.max(out.right, r.right), bottom: Math.max(out.bottom, r.bottom)
                    } : { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
                }
                return out;
            }

            window.safetyVaultTour = {
                reducedMotion: function () {
                    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
                },

                // Scrolls the page so the target clears the bubble and the bar. Returns whether it
                // moved, because the caller has to wait out a smooth scroll before measuring —
                // a rectangle read mid-scroll is already stale by the time it arrives.
                //
                // The room to leave is measured here rather than passed in: the bubble is already
                // rendered with this step's text, so its height is known, and the caller only has
                // the *previous* step's height. Passing that in scrolled short on whichever step
                // had the longest text, dropping its target — and its title — too low.
                scrollFor: function (names, instant) {
                    var pg = page(), u = union(names);
                    if (!pg || !u) return false;
                    var bubble = document.querySelector(BUBBLE);
                    var room = (bubble ? bubble.offsetHeight : 118) + GAP + CLEAR;
                    var pr = pg.getBoundingClientRect();
                    var top = u.top - pr.top + pg.scrollTop;
                    var bottom = u.bottom - pr.top + pg.scrollTop;
                    var view = pg.clientHeight;
                    var want = pg.scrollTop;
                    if (bottom + room > want + view) want = Math.min(bottom + room - view, pg.scrollHeight - view);
                    if (top - 12 < want) want = Math.max(0, top - 12);
                    want = Math.max(0, Math.round(want));
                    if (Math.abs(want - pg.scrollTop) <= 1) return Promise.resolve(false);
                    if (instant) { pg.scrollTop = want; return Promise.resolve(true); }

                    // Animated by hand rather than with scrollTo({behavior:'smooth'}), which this
                    // WebView accepts and then ignores — the page stayed exactly where it was
                    // while the caller waited out a fixed delay and measured a target that had
                    // never moved. Driving it here also means the promise resolves when the
                    // scroll has genuinely finished, so nothing downstream has to guess.
                    var from = pg.scrollTop, delta = want - from, t0 = null, DUR = 280;
                    return new Promise(function (done) {
                        var finished = false;
                        function settle() {
                            if (finished) return;
                            finished = true;
                            clearTimeout(guard);
                            pg.scrollTop = want;
                            done(true);
                        }
                        // requestAnimationFrame stops firing while the app is in the background,
                        // so without this the promise would never resolve and the tour would sit
                        // on a blank veil until the user came back. Snap and carry on instead.
                        var guard = setTimeout(settle, DUR + 320);
                        function frame(now) {
                            if (finished) return;
                            if (t0 === null) t0 = now;
                            var k = Math.min(1, (now - t0) / DUR);
                            // cubic-bezier(.4,0,.2,1) is not expressible here; this is its shape.
                            var e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
                            pg.scrollTop = from + delta * e;
                            if (k < 1) requestAnimationFrame(frame);
                            else settle();
                        }
                        requestAnimationFrame(frame);
                    });
                },

                // The cutout, plus where the bubble and the bar end up. One call: the bubble is
                // already rendered with this step's text when this runs, so its height is real.
                layout: function (names, pad, radius) {
                    var sc = shell();
                    if (!sc) return { found: false };
                    var sr = sc.getBoundingClientRect();
                    var sw = Math.round(sr.width), sh = Math.round(sr.height);
                    var bubble = document.querySelector(BUBBLE);
                    var bh = bubble ? Math.round(bubble.offsetHeight) : 118;
                    var bw = sw - SIDE * 2;
                    var u = union(names);

                    var missing = { found: false, sw: sw, sh: sh, bh: bh, bw: bw,
                                    by: Math.round((sh - bh) / 2) - 20, arrow: false, ax: 0, ay: 0,
                                    barTop: false, barH: BAR };
                    if (!u) return missing;

                    var x = u.left - sr.left - pad, y = u.top - sr.top - pad;
                    var w = u.right - sr.left + pad - x, h = u.bottom - sr.top + pad - y;
                    // Off-screen is not the same as absent, but for a spotlight it ends the same
                    // way — checked before clamping, so the clamp cannot rescue a target that is
                    // genuinely outside.
                    if (w <= 8 || h <= 8 || y + h < 4 || y > sh - 4 || x + w < 4 || x > sw - 4) return missing;

                    // The ring is drawn on the cutout's own edge. Where the target touches the
                    // screen edge — the menu button does — the cutout gives up 2px so the ring
                    // does not come out sliced by the bezel.
                    if (y < 2) { h += y - 2; y = 2; }
                    if (x < 2) { w += x - 2; x = 2; }
                    if (x + w > sw - 2) w = sw - 2 - x;

                    // A target the page cannot scroll clear of — fixed chrome like the drawer's
                    // footer — sends the bar to the other end instead.
                    var barTop = (y + h) > (sh - CLEAR);
                    var topRoom = barTop ? BAR_TOP + 8 : 8;
                    var botRoom = barTop ? 8 : CLEAR;

                    var by, arrow = true, ay;
                    var below = y + h + GAP;
                    if (below + bh <= sh - botRoom) { by = below; ay = -6; }
                    else if (y - GAP - bh >= topRoom) { by = y - GAP - bh; ay = bh - 6; }
                    // Fits neither side: it leans on the bar and drops the arrow. Clamped to the
                    // top so a tall bubble loses its last line rather than its title — the title
                    // is the part that says which stop this is.
                    else { by = Math.max(topRoom, sh - botRoom - bh); arrow = false; ay = 0; }

                    // Points at the target's centre, but stops short of its own rounded corners.
                    var ax = Math.round(Math.max(18, Math.min(bw - 30, x + w / 2 - SIDE - 6)));

                    return {
                        found: true, sw: sw, sh: sh, bh: bh, bw: bw,
                        x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h),
                        r: radius + pad,
                        by: Math.round(by), ax: ax, ay: Math.round(ay), arrow: arrow,
                        barTop: barTop, barH: barTop ? BAR_TOP : BAR
                    };
                },

                // Room at the foot of the page so the bar never covers the last tile. Nothing
                // moves — the scrollable area just gets longer while the tour is open. A class
                // rather than an inline style, because .page's own padding carries the iOS safe
                // area and an inline value would drop it.
                pad: function (on) {
                    var pg = page();
                    if (pg) pg.classList.toggle('tour-room', !!on);
                }
            };
        })();

        // ── Open the field-type menu upward when it would fall off the screen ──
        // The menu hangs below its button, which is fine for the first field and useless for the
        // last one in a long form: the options ended up past the bottom edge with no way to reach
        // them. Measured after it is inserted, because only then is its height known.
        (function () {
            function place(menu) {
                menu.classList.remove('up');
                var rect = menu.getBoundingClientRect();
                // visualViewport is the box actually visible — it shrinks when the keyboard is up.
                var visible = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
                if (rect.bottom > visible - 8) menu.classList.add('up');
            }

            new MutationObserver(function (records) {
                for (var i = 0; i < records.length; i++) {
                    var added = records[i].addedNodes;
                    for (var j = 0; j < added.length; j++) {
                        var node = added[j];
                        if (node.nodeType !== 1) continue;
                        if (node.classList && node.classList.contains('type-menu')) {
                            place(node);
                        } else if (node.querySelector) {
                            var inner = node.querySelector('.type-menu');
                            if (inner) place(inner);
                        }
                    }
                }
            }).observe(document.body, { childList: true, subtree: true });
        })();

        // ── Swipe-down on the sheet grip to dismiss (drag handle gesture) ──
        (function () {
            var sheet = null, startY = 0, moved = 0;

            document.addEventListener('pointerdown', function (e) {
                var grip = e.target.closest && e.target.closest('.sheet-grip');
                if (!grip) return;
                sheet = grip.closest('.sheet');
                if (!sheet) return;
                startY = e.clientY;
                moved = 0;
                sheet.style.transition = 'none';
            });

            document.addEventListener('pointermove', function (e) {
                if (!sheet) return;
                moved = Math.max(0, e.clientY - startY);
                sheet.style.transform = 'translateY(' + moved + 'px)';
            });

            document.addEventListener('pointerup', function () {
                if (!sheet) return;
                var s = sheet;
                sheet = null;
                s.style.transition = 'transform .2s ease';
                if (moved > 90) {
                    // Past the threshold: slide out and trigger the backdrop's close handler.
                    var backdrop = s.closest('.sheet-backdrop');
                    s.style.transform = 'translateY(110%)';
                    setTimeout(function () {
                        s.style.transform = '';
                        s.style.transition = '';
                        if (backdrop) backdrop.click();
                    }, 180);
                } else {
                    // Snap back.
                    s.style.transform = 'translateY(0)';
                    setTimeout(function () { s.style.transform = ''; s.style.transition = ''; }, 200);
                }
            });
        })();
    </script>

</body>

</html>
